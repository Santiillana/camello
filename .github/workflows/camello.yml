name: Verificar y compilar CAMELLO

on:
  push:
    branches: ["main", "camello-hardening-v1"]
  pull_request:
    branches: ["main"]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  android:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync android
      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: camello-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
