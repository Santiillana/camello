name: Seguridad de suministro CAMELLO

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Auditar dependencias npm
        run: npm audit --audit-level=high
      - name: Buscar secretos en el árbol
        run: |
          if grep -RInE --exclude-dir=.git --exclude=package-lock.json --exclude='*.md' '(BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36,}|AIza[0-9A-Za-z_-]{30,})' .; then
            echo "Se encontró un patrón de secreto."
            exit 1
          fi
      - name: Buscar secretos también en el historial Git
        run: |
          matches=""
          while read -r sha; do
            hit=$(git grep -nE '(BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36,}|AIza[0-9A-Za-z0-9_-]{30,})' "$sha" -- . ':(exclude)package-lock.json' ':(exclude)**/*.md' || true)
            if [ -n "$hit" ]; then
              matches="$matches$hit"$'\n'
            fi
          done < <(git rev-list HEAD)
          if [ -n "$matches" ]; then
            echo "Patrones de secreto detectados en el historial alcanzable por HEAD:"
            printf '%s\n' "$matches"
            exit 1
          fi
          echo "Búsqueda histórica completada: sin patrones de secreto."
      - name: Generar SBOM
        run: npm sbom --sbom-format=spdx > camello-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: camello-sbom
          path: camello-sbom.spdx.json
          if-no-files-found: error
