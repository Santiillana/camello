name: Auditoria diagnostica temporal
on:
  push:
    branches: ["fix/sqlite-wasm-web"]
    paths-ignore: ["docs/_diagnostico_ci.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["docs/_diagnostico_ci.md"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Ejecutar compuertas
        shell: bash
        run: |
          set +e
          for spec in "npm ci" "npx tsc -b" "npm run lint" "npm run verify:ubicacion" "npm run verify:security" "npm run verify:modulos" "npm run verify:db" "npm run benchmark:db" "npm run build"; do
            name=$(echo "$spec" | tr " /:" "___")
            bash -lc "$spec" > "/tmp/$name.log" 2>&1
            echo $? > "/tmp/$name.exit"
          done
          mkdir -p /tmp/audit
          for f in /tmp/*.log; do echo "===== $(basename "$f") ====="; cat "$f"; done > /tmp/audit/resultados.txt
          for f in /tmp/*.exit; do echo "$(basename "$f")=$(cat "$f")"; done > /tmp/audit/codigos.txt
      - name: Guardar diagnóstico en branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/write_report.py << "PY"
          import base64, json, os, urllib.request
          path="docs/_diagnostico_ci.md"
          report="# Diagnóstico CI\n\nCommit: "+os.environ["GITHUB_SHA"]+"\n\n"
          report += open("/tmp/audit/codigos.txt",encoding="utf-8").read()+"\n\n"
          report += open("/tmp/audit/resultados.txt",encoding="utf-8",errors="replace").read()
          content=base64.b64encode(report.encode()).decode()
          api="https://api.github.com/repos/Santiillana/camello/contents/"+path
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          try:
              req=urllib.request.Request(api+"?ref=fix/sqlite-wasm-web",headers=headers)
              with urllib.request.urlopen(req) as res: existing=json.load(res).get("sha")
          except Exception: existing=None
          payload={"message":"chore(auditoria): registrar salida completa CI [skip ci]","content":content,"branch":"fix/sqlite-wasm-web"}
          if existing: payload["sha"]=existing
          req=urllib.request.Request(api,data=json.dumps(payload).encode(),headers={**headers,"Content-Type":"application/json"},method="PUT")
          with urllib.request.urlopen(req) as res: print(res.read().decode())
          PY
          python3 /tmp/write_report.py
          exit 0
