name: Verificar CAMELLO

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ls sql.js jeep-sqlite @capacitor-community/sqlite
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run lint
      - name: Verify web SQLite in Chromium
        run: |
          node <<'NODE'
          import { spawn } from 'node:child_process';
          import { mkdtemp, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';

          const host = '127.0.0.1';
          const port = 5173;
          const cdpPort = 9222;
          const baseUrl = 'http://' + host + ':' + port;
          const wasmUrl = baseUrl + '/assets/sql-wasm.wasm';
          const dbName = '__camello_ci_jeep_sqlite__';

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function waitFor(check, timeout, label) {
            const end = Date.now() + timeout;
            while (Date.now() < end) {
              try {
                const value = await check();
                if (value) return value;
              } catch {}
              await sleep(250);
            }
            throw new Error('Timeout esperando ' + label);
          }

          async function chromeCommand() {
            for (const command of ['google-chrome', 'google-chrome-stable', 'chromium', 'chromium-browser']) {
              const p = spawn(command, ['--version']);
              const ok = await new Promise((resolve) => {
                p.on('error', () => resolve(false));
                p.on('exit', (code) => resolve(code === 0));
              });
              if (ok) return command;
            }
            throw new Error('No se encontró Chrome/Chromium');
          }

          function cdpClient(url, onProblem) {
            const ws = new WebSocket(url);
            const pending = new Map();
            let nextId = 1;

            ws.addEventListener('message', (event) => {
              const message = JSON.parse(String(event.data));
              if (message.method === 'Runtime.exceptionThrown') onProblem(JSON.stringify(message.params.exceptionDetails));
              if (
                message.method === 'Runtime.consoleAPICalled' &&
                (message.params.type === 'error' || message.params.type === 'warning')
              ) {
                const text = (message.params.args || [])
                  .map((arg) => arg.value ?? arg.description ?? '')
                  .join(' ');
                if (/LinkError|Aborted/i.test(text)) onProblem(text);
              }
              if (message.id && pending.has(message.id)) {
                const item = pending.get(message.id);
                pending.delete(message.id);
                if (message.error) item.reject(new Error(message.error.message));
                else item.resolve(message.result);
              }
            });

            return {
              ws,
              open: () => new Promise((resolve, reject) => {
                ws.addEventListener('open', resolve, { once: true });
                ws.addEventListener('error', reject, { once: true });
              }),
              call: (method, params = {}) => new Promise((resolve, reject) => {
                const id = nextId++;
                pending.set(id, { resolve, reject });
                ws.send(JSON.stringify({ id, method, params }));
              }),
            };
          }

          async function evaluate(cdp, expression) {
            const result = await cdp.call('Runtime.evaluate', {
              expression,
              awaitPromise: true,
              returnByValue: true,
            });
            if (result.exceptionDetails) throw new Error(result.exceptionDetails.text || 'Runtime.evaluate falló');
            return result.result?.value;
          }

          const server = spawn('npm', ['run', 'dev', '--', '--host', host], {
            stdio: ['ignore', 'pipe', 'pipe'],
          });
          const profile = await mkdtemp(join(tmpdir(), 'camello-chrome-'));
          const chrome = await chromeCommand();
          const browser = spawn(chrome, [
            '--headless=new',
            '--no-sandbox',
            '--disable-gpu',
            '--disable-dev-shm-usage',
            '--remote-debugging-port=' + cdpPort,
            '--user-data-dir=' + profile,
            'about:blank',
          ], { stdio: ['ignore', 'pipe', 'pipe'] });

          let cdp;
          try {
            await waitFor(async () => (await fetch(baseUrl)).ok, 30000, 'Vite');
            const wasm = await fetch(wasmUrl);
            const bytes = new Uint8Array(await wasm.arrayBuffer());
            const contentType = wasm.headers.get('content-type') || '';
            if (!wasm.ok) throw new Error('WASM HTTP ' + wasm.status);
            if (!contentType.toLowerCase().startsWith('application/wasm')) {
              throw new Error('Content-Type WASM incorrecto: ' + contentType);
            }
            if (bytes[0] !== 0 || bytes[1] !== 97 || bytes[2] !== 115 || bytes[3] !== 109) {
              throw new Error('La respuesta WASM no tiene firma binaria válida');
            }

            await waitFor(
              async () => (await fetch('http://' + host + ':' + cdpPort + '/json/version')).ok,
              20000,
              'Chrome CDP'
            );
            const target = await fetch(
              'http://' + host + ':' + cdpPort + '/json/new?about:blank',
              { method: 'PUT' }
            ).then((response) => response.json());

            let runtimeProblem = null;
            cdp = cdpClient(target.webSocketDebuggerUrl, (problem) => {
              runtimeProblem = problem;
            });
            await cdp.open();
            await cdp.call('Runtime.enable');
            await cdp.call('Page.enable');
            await cdp.call('Log.enable');
            await cdp.call('Page.navigate', { url: baseUrl });

            await waitFor(
              () => evaluate(cdp, "document.querySelector('.app-shell') !== null"),
              30000,
              'CAMELLO'
            );
            if (runtimeProblem) throw new Error('Error de runtime: ' + runtimeProblem);

            await evaluate(cdp, "(async () => { const jeep = document.querySelector('jeep-sqlite'); await customElements.whenDefined('jeep-sqlite'); if (!jeep) throw new Error('No existe <jeep-sqlite>'); await jeep.createConnection({database: '" + dbName + "', version: 1}); await jeep.open({database: '" + dbName + "'}); await jeep.execute({database: '" + dbName + "', statements: 'CREATE TABLE smoke_test (id INTEGER PRIMARY KEY, value TEXT NOT NULL);'}); await jeep.run({database: '" + dbName + "', statement: 'INSERT INTO smoke_test (value) VALUES (?);', values: ['persisted']}); await jeep.saveToStore({database: '" + dbName + "}); await jeep.close({database: '" + dbName + "'}); return true; })()");
          } finally {
            cdp?.ws.close();
            browser.kill('SIGTERM');
            server.kill('SIGTERM');
            await rm(profile, { recursive: true, force: true });
          }
          NODE

  android:
    runs-on: ubuntu-latest
    needs: web
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      PATH: /usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:/usr/local/lib/android/sdk/emulator:${{ env.PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug --no-daemon
