name: Compilar APK de CAMELLO

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: camello-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar dependencias del navegador para Verify
        run: npx playwright install --with-deps chromium

      - name: Verificar proyecto web
        run: timeout --signal=TERM --kill-after=30s 15m npm run verify

      - name: Construir assets web
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: "true"

      - name: Dar permiso de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Ejecutar pruebas instrumentadas Android en emulador real
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: android
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Compilar APK debug
        working-directory: android
        run: |
          VERSION_NAME=$(node -p "require('../package.json').version")
          ./gradlew assembleDebug --no-daemon \
            -PversionCodeOverride="${{ github.run_number }}" \
            -PversionNameOverride="$VERSION_NAME"

      - name: Preparar APK para descargar
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "CAMELLO-debug-v${VERSION_NAME}.apk"
          sha256sum "CAMELLO-debug-v${VERSION_NAME}.apk" | tee "CAMELLO-debug-v${VERSION_NAME}.apk.sha256"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAMELLO-debug-v${{ github.run_number }}
          path: |
            CAMELLO-debug-v*.apk
            CAMELLO-debug-v*.apk.sha256
          if-no-files-found: error
          retention-days: 7
