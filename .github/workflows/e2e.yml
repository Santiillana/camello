name: E2E CAMELLO

on:
  push:
    branches: ["fix/sqlite-wasm-web"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camello-e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright@1.55.0 install --with-deps chromium
      - run: VITE_E2E=1 node scripts/e2e-core.mjs
